# RupeeWise Spring Boot Application Properties
spring.application.name=RupeeWise

# Server Port
server.port=8080

# H2 Persistent File Database Configuration
spring.datasource.url=jdbc:h2:file:./data/rupeewisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console for faculty demo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Application Timezone and Locale Settings
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.locale=en_IN
spring.jackson.date-format=yyyy-MM-dd

# Logging
logging.level.com.rupeewise=INFO
logging.level.org.springframework.web=INFO
